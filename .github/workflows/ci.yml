name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: k_coffee_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d k_coffee_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/k_coffee_ci
      BETTER_AUTH_SECRET: ci-only-not-a-production-secret
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations to disposable PostgreSQL
        run: npx prisma migrate deploy

      - name: Lint and typecheck
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Build production application
        run: npm run build

      - name: Seed disposable browser-test data
        run: npx prisma db seed

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser role flows
        run: INTEGRATION_DATABASE_NAME=k_coffee_ci npm run test:e2e
